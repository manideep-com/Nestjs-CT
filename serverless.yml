service: commercetools-microservice
useDotenv: true

provider:
  name: aws
  runtime: nodejs18.x
  stage: ${opt:stage, 'dev'}
  region: us-east-1
  memorySize: 512
  timeout: 30
  environment:
    NODE_ENV: production
    CTP_PROJECT_KEY: ${env:CTP_PROJECT_KEY}
    CTP_CLIENT_ID: ${env:CTP_CLIENT_ID}
    CTP_CLIENT_SECRET: ${env:CTP_CLIENT_SECRET}
    CTP_API_URL: ${env:CTP_API_URL}
    CTP_AUTH_URL: ${env:CTP_AUTH_URL}
    CTP_SCOPES: ${env:CTP_SCOPES}

functions:
  api:
    handler: dist/lambda.handler
    events:
      - httpApi: '*'

plugins:
  - serverless-offline

package:
  patterns:
    # Exclude everything first
    - '!**'
    
    # Include compiled code
    - 'dist/**'
    - 'package.json'
    
    # Include ALL runtime dependencies (simpler approach)
    - 'node_modules/**'
    
    # Explicitly exclude only dev dependencies
    - '!node_modules/@types/**'
    - '!node_modules/typescript/**'
    - '!node_modules/ts-node/**'
    - '!node_modules/@typescript-eslint/**'
    - '!node_modules/eslint/**'
    - '!node_modules/eslint-*/**'
    - '!node_modules/prettier/**'
    - '!node_modules/jest/**'
    - '!node_modules/@jest/**'
    - '!node_modules/jest-*/**'
    - '!node_modules/@nestjs/testing/**'
    - '!node_modules/@nestjs/schematics/**'
    - '!node_modules/supertest/**'
    - '!node_modules/ts-jest/**'
    - '!node_modules/.cache/**'
    - '!node_modules/serverless/**'
    - '!node_modules/serverless-*/**'
    - '!node_modules/tslib/**'
    
    # Exclude other unnecessary files
    - '!.git/**'
    - '!test/**'
    - '!coverage/**'
    - '!src/**'
    - '!*.md'
    - '!.env'
    - '!.env.*'
    - '!.vscode/**'
    - '!.idea/**'
    - '!*.config.js'
    - '!tsconfig*.json'